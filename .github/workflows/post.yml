name: auto-post

# わかな(@wakana_emeta) 自動投稿。Macが動いていなくてもGitHubのクラウドで実行する。
# 投稿時刻(JST 08:00 / 12:30 / 17:00 / 21:00)を UTC に変換して指定。
# cron は UTC。GitHub Actions のcronは数分〜十数分遅延することがある(許容)。
on:
  schedule:
    - cron: "0 23 * * *"    # 08:00 JST
    - cron: "30 3 * * *"    # 12:30 JST
    - cron: "0 8 * * *"    # 17:00 JST
    - cron: "0 12 * * *"    # 21:00 JST
  workflow_dispatch:        # 手動テスト用
    inputs:
      dry_run:
        description: "true なら生成のみで投稿しない(検証用)"
        type: boolean
        default: false

concurrency:
  group: auto-post          # 多重起動による二重投稿を防止
  cancel-in-progress: false

permissions:
  issues: write            # 失敗時にIssueで通知するため
  contents: write           # テーマ履歴(recent_themes.json)を commit back するため

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install anthropic python-dotenv requests-oauthlib requests

      - name: Generate & post
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          X_LIVE_POST: ${{ github.event.inputs.dry_run == 'true' && 'false' || 'true' }}
          X_REPLY_THREAD_RATE: ${{ vars.X_REPLY_THREAD_RATE || '0.3' }}
        run: |
          set -o pipefail
          python scripts/pipeline.py 2>&1 | tee /tmp/pipeline.log

      - name: Persist theme rotation state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A logs/recent_themes.json drafts/posted drafts/pending drafts/failed 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist post state [skip ci]"
            git push
          else
            echo "no state change to commit"
          fi
      - name: Alert on failure (GitHub Issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "auto-post failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "再失敗: $url"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "🚨 auto-post failed" \
              --body "自動投稿ワークフローが失敗しました。放置すると投稿が止まります。ログ: $url"
          fi

      # 実行結果をダッシュボードへ通知する。
      # 2026-07-25〜28 は Anthropic のクレジット残高不足で生成が失敗し続けたが、
      # ダッシュボード側からは「投稿が止まった」ことしか分からず4日間放置された。
      # 失敗理由をそのまま送り、稼働ヘルスに出せるようにする。
      - name: Report run result to dashboard
        if: always()
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          JOB_STATUS: ${{ job.status }}
          ACCOUNT: "wakana"
        run: |
          set +e
          [ -n "$DASHBOARD_URL" ] && [ -n "$SYNC_SECRET" ] || { echo "dashboard notify skipped (secret未設定)"; exit 0; }
          err=""
          if [ "$JOB_STATUS" != "success" ] && [ -f /tmp/pipeline.log ]; then
            err=$(grep -iE "error|exception|traceback" /tmp/pipeline.log | tail -3 | head -c 500)
            [ -n "$err" ] || err=$(tail -5 /tmp/pipeline.log | head -c 500)
          fi
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          payload=$(jq -nc \
            --arg a "$ACCOUNT" --arg r "${{ github.run_id }}" --arg s "$JOB_STATUS" \
            --arg e "$err" --arg u "$url" --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{account:$a,runId:$r,status:$s,error:$e,runUrl:$u,startedAt:$t}')
          curl -sS -m 20 -X POST "${DASHBOARD_URL%/}/api/pipeline" \
            -H "content-type: application/json" \
            -H "x-sync-secret: $SYNC_SECRET" \
            -d "$payload" && echo "" || echo "dashboard notify failed (無視して続行)"
          exit 0
